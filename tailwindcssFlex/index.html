<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout with Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <div class="flex flex-row gap-4 p-4">
        <div class="flex-1 bg-red-200 text-center p-4">Colonna 1</div>
        <div class="flex-1 bg-green-200 text-center p-4">Colonna 2</div>
        <div class="flex-1 bg-blue-200 text-center p-4">Colonna 3</div>
    </div>

    <div class="flex flex-col gap-4 p-4">
        <div class="bg-yellow-200 text-center p-4">Elemento 1</div>
        <div class="bg-purple-200 text-center p-4">Elemento 2</div>
        <div class="bg-pink-200 text-center p-4">Elemento 3</div>
    </div>

    <div class="flex justify-center items-center h-48 bg-gray-200">
        <div class="bg-blue-400 text-white font-bold p-8 rounded-lg">Layout centrato orizzontalmente e verticalmente
        </div>
    </div>

    <div class="flex flex-wrap gap-4 p-4 m-4 bg-gray-100">
        <div class="w-1/4 bg-red-400 text-white p-4 text-center">1</div>
        <div class="w-1/4 bg-green-400 text-white p-4 text-center">2</div>
        <div class="w-1/4 bg-blue-400 text-white p-4 text-center">3</div>
        <div class="w-1/4 bg-yellow-400 text-white p-4 text-center">4</div>
        <div class="w-1/4 bg-purple-400 text-white p-4 text-center">5</div>
        <div class="w-1/4 bg-pink-400 text-white p-4 text-center">6</div>
    </div>
</body>

</html>
